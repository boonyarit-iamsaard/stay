# Local infrastructure: the backing services an app needs to run from source.
# `pnpm dev` talks to these.
#
# The apps themselves are in docker-compose.override.yml, which Compose merges
# in automatically — see the Deployment section of README.md.
name: stay

services:
  postgres:
    image: postgres:18-alpine
    container_name: stay-postgres
    environment:
      POSTGRES_DB: stay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - stay-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stay-network

volumes:
  stay-postgres-data:
    name: stay-postgres-data

networks:
  stay-network:
    name: stay-network
